name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear archivos del proyecto
        run: |
          mkdir -p app/src/main/java/com/minimal/launcher app/src/main/res/layout

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MinimalLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.6.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.minimal.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.minimal.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Minimal"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="portrait"
                      android:resizeableActivity="false">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/minimal/launcher/MainActivity.kt << 'EOF'
          package com.minimal.launcher

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.GestureDetector
          import android.view.MotionEvent
          import kotlin.math.abs

          class MainActivity : Activity() {

              private lateinit var drawer: AppDrawer

              private val gestures by lazy {
                  GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                          if (e1 == null) return false
                          val dx = e2.x - e1.x
                          val dy = e2.y - e1.y
                          if (abs(dy) < abs(dx) || abs(dy) < 120 || abs(vy) < 600) return false
                          if (dy < 0) drawer.show(focusSearch = false)
                          else drawer.show(focusSearch = true)
                          return true
                      }

                      override fun onLongPress(e: MotionEvent) {
                          startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                      }
                  })
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  drawer = AppDrawer(this, findViewById(R.id.drawer_root))
              }

              override fun onTouchEvent(event: MotionEvent): Boolean =
                  gestures.onTouchEvent(event) || super.onTouchEvent(event)

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  drawer.hide()
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (drawer.isShowing) drawer.hide() else super.onBackPressed()
              }
          }
          EOF

          cat > app/src/main/java/com/minimal/launcher/AppDrawer.kt << 'EOF'
          package com.minimal.launcher

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.drawable.Drawable
          import android.os.Handler
          import android.os.Looper
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.core.widget.doAfterTextChanged
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          data class AppEntry(
              val label: String,
              val category: String,
              val icon: Drawable,
              val component: ComponentName
          )

          private val CATEGORY_ORDER = listOf("Comunicación", "Multimedia", "Productividad", "Juegos", "Mapas", "Otros")

          private fun categoryOf(ai: ApplicationInfo): String = when (ai.category) {
              ApplicationInfo.CATEGORY_SOCIAL, ApplicationInfo.CATEGORY_NEWS -> "Comunicación"
              ApplicationInfo.CATEGORY_AUDIO, ApplicationInfo.CATEGORY_VIDEO, ApplicationInfo.CATEGORY_IMAGE -> "Multimedia"
              ApplicationInfo.CATEGORY_PRODUCTIVITY -> "Productividad"
              ApplicationInfo.CATEGORY_GAME -> "Juegos"
              ApplicationInfo.CATEGORY_MAPS -> "Mapas"
              else -> "Otros"
          }

          class AppDrawer(private val activity: Activity, private val root: View) {

              private val main = Handler(Looper.getMainLooper())
              private val all = mutableListOf<AppEntry>()
              private val adapter = Adapter()
              private val search: EditText = root.findViewById(R.id.search)
              private val recycler: RecyclerView = root.findViewById(R.id.recycler)
              private var loaded = false

              private val grayscale = ColorMatrixColorFilter(ColorMatrix().apply { setSaturation(0f) })

              val isShowing: Boolean get() = root.visibility == View.VISIBLE

              init {
                  val lm = GridLayoutManager(activity, 4)
                  lm.spanSizeLookup = object : GridLayoutManager.SpanSizeLookup() {
                      override fun getSpanSize(position: Int): Int = if (adapter.isHeader(position)) 4 else 1
                  }
                  recycler.layoutManager = lm
                  recycler.adapter = adapter
                  recycler.setHasFixedSize(true)
                  search.doAfterTextChanged { render(it?.toString().orEmpty()) }
              }

              fun show(focusSearch: Boolean) {
                  root.visibility = View.VISIBLE
                  if (!loaded) load()
                  if (focusSearch) {
                      search.requestFocus()
                      inputMethodManager().showSoftInput(search, 0)
                  }
              }

              fun hide() {
                  root.visibility = View.GONE
                  search.setText("")
                  inputMethodManager().hideSoftInputFromWindow(search.windowToken, 0)
              }

              private fun inputMethodManager() =
                  activity.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager

              private fun load() {
                  loaded = true
                  Thread {
                      val pm = activity.packageManager
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val entries = pm.queryIntentActivities(intent, 0)
                          .filter { it.activityInfo.packageName != activity.packageName }
                          .map { ri ->
                              AppEntry(
                                  label = ri.loadLabel(pm).toString(),
                                  category = categoryOf(ri.activityInfo.applicationInfo),
                                  icon = ri.loadIcon(pm),
                                  component = ComponentName(ri.activityInfo.packageName, ri.activityInfo.name)
                              )
                          }
                          .sortedBy { it.label.lowercase() }

                      main.post {
                          all.clear()
                          all.addAll(entries)
                          render(search.text.toString())
                      }
                  }.start()
              }

              private fun render(query: String) {
                  val q = query.trim()
                  val matches = all.filter { q.isEmpty() || it.label.contains(q, ignoreCase = true) }
                  val items = mutableListOf<Any>()
                  CATEGORY_ORDER.forEach { cat ->
                      val group = matches.filter { it.category == cat }
                      if (group.isNotEmpty()) {
                          items.add(cat)
                          items.addAll(group)
                      }
                  }
                  adapter.submit(items)
              }

              private inner class Adapter : RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                  private var items: List<Any> = emptyList()

                  fun submit(newItems: List<Any>) {
                      items = newItems
                      notifyDataSetChanged()
                  }

                  fun isHeader(position: Int): Boolean = items[position] is String

                  override fun getItemViewType(position: Int): Int = if (isHeader(position)) 0 else 1

                  override fun getItemCount(): Int = items.size

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                      return if (viewType == 0) {
                          val tv = TextView(parent.context).apply {
                              textSize = 12f
                              setTextColor(0xFF9E9E9E.toInt())
                              setPadding(32, 40, 32, 8)
                          }
                          object : RecyclerView.ViewHolder(tv) {}
                      } else {
                          AppHolder(LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false))
                      }
                  }

                  override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {
                      when (val item = items[position]) {
                          is String -> (holder.itemView as TextView).text = item
                          is AppEntry -> (holder as AppHolder).bind(item)
                      }
                  }
              }

              private inner class AppHolder(view: View) : RecyclerView.ViewHolder(view) {
                  private val icon: ImageView = view.findViewById(R.id.icon)
                  private val label: TextView = view.findViewById(R.id.label)

                  fun bind(app: AppEntry) {
                      icon.setImageDrawable(app.icon)
                      icon.colorFilter = grayscale
                      label.text = app.label
                      itemView.setOnClickListener {
                          activity.startActivity(
                              Intent(Intent.ACTION_MAIN)
                                  .addCategory(Intent.CATEGORY_LAUNCHER)
                                  .setComponent(app.component)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                          hide()
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|center_horizontal"
                  android:layout_marginTop="96dp"
                  android:format12Hour="h:mm"
                  android:format24Hour="HH:mm"
                  android:textColor="#FFFFFF"
                  android:textSize="56sp" />

              <FrameLayout
                  android:id="@+id/drawer_root"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:visibility="gone">

                  <EditText
                      android:id="@+id/search"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_gravity="top"
                      android:layout_marginStart="24dp"
                      android:layout_marginTop="48dp"
                      android:layout_marginEnd="24dp"
                      android:background="@null"
                      android:hint="Buscar"
                      android:imeOptions="actionSearch"
                      android:inputType="text"
                      android:singleLine="true"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#666666"
                      android:textSize="18sp" />

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/recycler"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:layout_marginTop="120dp"
                      android:paddingBottom="48dp"
                      android:clipToPadding="false" />
              </FrameLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/item_app.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="?android:attr/selectableItemBackgroundBorderless"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="8dp">

              <ImageView
                  android:id="@+id/icon"
                  android:layout_width="48dp"
                  android:layout_height="48dp" />

              <TextView
                  android:id="@+id/label"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:maxLines="1"
                  android:textColor="#E0E0E0"
                  android:textSize="11sp" />
          </LinearLayout>
          EOF

          echo "Proyecto generado:"
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma Android 35
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SDKMANAGER" --licenses) > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
